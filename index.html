<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>즐겨찾기 포털</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>

  <!-- ─── 스플래시 (자동 로그인 중) ─── -->
  <div id="splashScreen" class="splash-screen">
    <div class="splash-inner">
      <div class="splash-spinner"></div>
      <p>로그인 중...</p>
    </div>
  </div>

  <!-- ─── 로그인 필요 시 ─── -->
  <div id="loginScreen" class="login-screen" style="display:none">
    <div class="login-box">
      <h2 class="login-title">즐겨찾기 포털</h2>
      <p class="login-desc">Microsoft 계정으로 로그인하세요</p>
      <button id="btnLogin" class="btn-ms-login">
        <svg width="20" height="20" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        Microsoft 로그인
      </button>
      <p id="loginError" class="login-error"></p>
    </div>
  </div>

  <!-- ─── 메인 앱 ─── -->
  <div id="appWrap" class="app-wrap" style="display:none">

    <!-- 사이드바 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <button id="btnToggle" class="btn-icon" title="메뉴 접기/펼치기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="sidebar-title">즐겨찾기</span>
      </div>

      <nav id="navList" class="nav-list">
        <!-- 즐겨찾기 항목이 동적으로 렌더링됨 -->
      </nav>

      <div class="sidebar-footer">
        <div class="footer-user-wrap">
          <div class="user-avatar-sm" id="userAvatar">U</div>
          <div class="footer-user-detail">
            <span id="footerUserName" class="footer-user-name"></span>
            <span id="footerUserRole" class="footer-user-role"></span>
          </div>
        </div>
        <div class="footer-actions">
          <button id="btnManager" class="btn-icon" title="관리">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <button id="btnLogout" class="btn-icon" title="로그아웃">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="main-content">
      <!-- 환영 화면 -->
      <div id="welcomeScreen" class="screen welcome-screen">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <h2>즐겨찾기 포털</h2>
        <p>왼쪽 메뉴에서 사이트를 선택하세요.</p>
      </div>

      <!-- 로딩 -->
      <div id="loadingScreen" class="screen loading-screen" style="display:none">
        <div class="loading-spinner"></div>
        <p>로딩 중...</p>
      </div>

      <!-- iframe 차단 에러 -->
      <div id="errorScreen" class="screen error-screen" style="display:none">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        <h2 class="error-title">연결이 거부되었습니다</h2>
        <p id="errorDomain" class="error-domain"></p>
        <p class="error-desc">이 사이트는 보안 정책에 의해 iframe 내에서 표시할 수 없습니다.</p>
        <button id="btnOpenNew" class="btn-open-new">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          새 창에서 열기
        </button>
      </div>

      <!-- iframe -->
      <iframe id="contentFrame" class="content-frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-popups-to-escape-sandbox"></iframe>
    </main>
  </div>

  <!-- ─── 관리 모달 ─── -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-left">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <h3>설정</h3>
        </div>
        <button id="btnCloseModal" class="btn-icon modal-close">&times;</button>
      </div>

      <!-- 탭 -->
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="bookmarks">즐겨찾기</button>
        <button class="modal-tab" data-tab="admin" id="tabAdmin">관리자 설정</button>
      </div>

      <!-- 즐겨찾기 탭 -->
      <div class="modal-body" id="panelBookmarks">
        <div class="add-form">
          <h4 class="form-title">새 북마크 추가</h4>
          <div class="add-row">
            <img id="previewFav" class="preview-fav" src="" alt="" style="display:none;">
            <input type="text" id="inputUrl" placeholder="URL (https://...)">
          </div>
          <p id="inputHint" class="input-hint"></p>
          <div class="add-row">
            <input type="text" id="inputName" placeholder="이름">
          </div>
          <div class="add-row">
            <input type="text" id="inputDesc" placeholder="설명 (선택)">
          </div>
          <div class="add-row" id="visRow">
            <select id="inputVis">
              <option value="public">공개</option>
              <option value="admin">관리자 전용</option>
              <option value="private">개인</option>
            </select>
            <button id="btnAddBm" class="btn-add">추가</button>
          </div>
          <div id="addLoading" class="inline-loading" style="display:none">저장 중...</div>
        </div>
        <div id="bmSections"></div>
        <div id="bmLoading" class="inline-loading" style="display:none">목록 로딩 중...</div>
      </div>

      <!-- 관리자 탭 -->
      <div class="modal-body" id="panelAdmin" style="display:none">
        <div class="add-form">
          <h4 class="form-title">관리자 추가</h4>
          <div class="add-row">
            <input type="email" id="adminEmail" placeholder="사용자 이메일">
            <button id="btnAddAdmin" class="btn-add">추가</button>
          </div>
          <div id="adminAddLoading" class="inline-loading" style="display:none">처리 중...</div>
        </div>
        <div class="admin-list-header">
          <span class="ul-title">관리자 목록</span>
          <span class="ul-count" id="adminCount">0명</span>
        </div>
        <div id="adminList" class="admin-list"></div>
        <div id="adminLoading" class="inline-loading" style="display:none">목록 로딩 중...</div>
      </div>
    </div>
  </div>

  <!-- ─── 편집 모달 ─── -->
  <div id="editOverlay" class="modal-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <div class="modal-header-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <h3>북마크 편집</h3>
        </div>
        <button id="btnCloseEdit" class="btn-icon modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="add-row">
          <img id="editFav" class="preview-fav" src="" alt="" style="display:none;">
          <input type="text" id="editUrl" placeholder="URL">
        </div>
        <div class="add-row">
          <input type="text" id="editName" placeholder="이름">
        </div>
        <div class="add-row">
          <input type="text" id="editDesc" placeholder="설명 (선택)">
        </div>
        <div class="add-row" id="editVisRow">
          <select id="editVis">
            <option value="public">공개</option>
            <option value="admin">관리자 전용</option>
            <option value="private">개인</option>
          </select>
          <button id="btnSaveEdit" class="btn-add">저장</button>
        </div>
        <div id="editLoading" class="inline-loading" style="display:none">저장 중...</div>
      </div>
    </div>
  </div>

  <!-- ─── 호버 카드 ─── -->
  <div id="hoverCard" class="hover-card">
    <div class="hover-card-header">
      <img id="hoverFav" class="hover-fav" src="" alt="">
      <div class="hover-card-title">
        <strong id="hoverName"></strong>
        <span id="hoverUrl"></span>
      </div>
    </div>
    <p id="hoverDesc" class="hover-desc"></p>
    <span id="hoverTag" class="hover-tag"></span>
  </div>

  <!-- ─── 토스트 ─── -->
  <div id="toastMsg" class="toast-msg"></div>

  <!-- ─── Scripts ─── -->
  <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
