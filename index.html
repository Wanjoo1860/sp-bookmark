<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>즐겨찾기 포털</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ─── 사이드바 ─── -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <button class="hamburger" id="btnHamburger" onclick="toggleSidebar()">☰</button>
        <span class="sidebar-title">즐겨찾기</span>
    </div>

    <!-- 카테고리 목록 (로그인 후 표시) -->
    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <!-- 사이드바 하단: 사용자 정보 -->
    <div class="sidebar-footer" id="sidebarFooter">
        <span class="sidebar-user" id="sidebarUser"></span>
        <button class="icon-btn" id="btnSettings" onclick="toggleAdminPanel()" title="설정" style="display:none;">⚙</button>
        <button class="icon-btn" id="btnLogout" onclick="logout()" title="로그아웃" style="display:none;">⎋</button>
    </div>
</aside>

<!-- ─── 메인 콘텐츠 ─── -->
<main class="main-content" id="mainContent">

    <!-- 상단 바: 로그인 버튼 (미로그인 시 표시) -->
    <div class="top-bar" id="topBar">
        <div class="top-bar-left">
            <span class="env-badge" id="envBadge"></span>
        </div>
        <div class="top-bar-right" id="topBarRight">
            <!-- 로그인 버튼: 자동 로그인 실패 시 표시됨 -->
            <button class="btn btn-primary btn-login-top" id="btnMsLogin" onclick="login()" style="display:none;">
                Microsoft로 로그인
            </button>
            <!-- 로그인 후: 사용자 이름 표시 -->
            <span class="top-user-name" id="topUserName" style="display:none;"></span>
        </div>
    </div>

    <!-- 기본 안내 (로그인 전/북마크 미선택 시) -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">🖥</div>
        <h2>즐겨찾기 포털</h2>
        <p id="welcomeMsg">왼쪽 메뉴에서 사이트를 선택하세요.</p>
    </div>

    <!-- 북마크 그리드 (카테고리 선택 시) -->
    <div class="bookmark-grid" id="bookmarkGrid" style="display:none;"></div>

    <!-- 상태 메시지 -->
    <div class="status" id="status"></div>

    <!-- 관리자: 북마크 추가/수정 폼 -->
    <div class="form-area" id="addBookmarkForm" style="display:none;">
        <h3 id="formTitle">북마크 추가</h3>
        <div class="form-row">
            <input type="text" id="inputTitle" placeholder="사이트 이름">
            <input type="url" id="inputUrl" placeholder="URL (https://...)">
            <input type="text" id="inputCategory" placeholder="카테고리">
        </div>
        <div class="form-row">
            <input type="text" id="inputDescription" placeholder="설명 (선택)">
            <select id="inputVisibility">
                <option value="all">전체 공개</option>
                <option value="admin">관리자만</option>
            </select>
            <input type="text" id="inputIconUrl" placeholder="아이콘 URL (선택)">
            <input type="number" id="inputSortOrder" placeholder="정렬" value="0" style="width:70px;">
        </div>
        <div class="form-row" style="margin-top:10px;">
            <button class="btn btn-success" onclick="saveBookmark()">저장</button>
            <button class="btn btn-secondary" onclick="cancelBookmarkEdit()">취소</button>
        </div>
        <input type="hidden" id="editBookmarkId">
    </div>

    <!-- 관리자: 도구 모음 -->
    <div class="admin-toolbar" id="adminToolbar" style="display:none;">
        <button class="btn btn-primary" onclick="toggleAddForm()">+ 북마크 추가</button>
        <button class="btn btn-secondary" onclick="loadBookmarks()">새로고침</button>
    </div>

    <!-- 관리자: 사용자 관리 패널 -->
    <div class="admin-panel" id="adminPanel" style="display:none;">
        <h3>관리자 관리</h3>
        <div class="form-row" style="margin-bottom:15px;">
            <input type="text" id="inputAdminSearch" placeholder="이메일 또는 이름으로 검색" onkeydown="if(event.key==='Enter')searchUser()">
            <button class="btn btn-primary" onclick="searchUser()">검색</button>
            <button class="btn btn-secondary" onclick="loadAdminMembers()">목록 새로고침</button>
        </div>
        <div id="searchResults" class="search-results"></div>
        <table id="adminTable">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>이메일</th>
                    <th style="width:80px;">작업</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="3" class="table-empty">로딩 중...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- ─── 외부 라이브러리 ─── -->
<script src="https://res.cdn.office.net/teams-js/2.31.1/js/MicrosoftTeams.min.js"></script>
<script src="https://unpkg.com/@azure/msal-browser@4.25.0/lib/msal-browser.min.js"></script>

<!-- ─── 앱 스크립트 (로드 순서 중요) ─── -->
<script src="js/config.js"></script>
<script src="js/graph.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
